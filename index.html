<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calorie Tracker Plus</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .hidden {
            display: none !important;
        }

        /* --- MAIN VIEW STYLES --- */
        #main-view {
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            flex-grow: 1;
        }

        .logo-container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto 1rem auto;
            display: flex;
            justify-content: center;
        }

        .app-logo {
            width: 100%;
            max-width: 250px;
            aspect-ratio: 3 / 1;
            object-fit: cover;
            object-position: center;
            border-radius: 12px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 450px;
            width: 100%;
            margin: 0 auto 1.5rem auto;
            padding-top: 0.5rem;
        }

        .date-controls {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .date-display-wrapper {
            display: flex;
            flex-direction: column;
            min-width: 110px;
        }

        .date-display {
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .date-btn {
            background: #1e1e1e;
            border: 1px solid #333;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.1s;
        }

        .date-btn:active {
            background-color: #333;
        }

        .icon-btn {
            background: #1e1e1e;
            border: 1px solid #333;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.1s;
        }

        .icon-btn:active {
            background-color: #333;
        }

        /* Hero Layout */
        .hero-container {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 1rem;
            max-width: 450px;
            width: 100%;
            margin: 0 auto 2rem auto;
            align-items: center;
        }

        .display-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 190px;
            height: 190px;
        }

        .progress-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
            pointer-events: none;
        }

        .ring-bg {
            fill: none;
            stroke: #222;
            stroke-width: 10;
        }

        .ring-progress {
            fill: none;
            stroke: #34C759;
            stroke-width: 10;
            stroke-linecap: round;
            stroke-dasharray: 534.07;
            stroke-dashoffset: 534.07;
            transition: stroke-dashoffset 0.5s ease-out, stroke 0.3s ease;
        }

        .ring-progress.over-target {
            stroke: #FF3B30;
        }

        .circle-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .count {
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: -2px;
            transition: transform 0.1s ease;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .target-btn {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            color: #aaa;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: border-color 0.2s, color 0.2s;
        }

        .side-metrics {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .metric-box {
            background: #1a1a1a;
            padding: 0.65rem 1rem;
            border-radius: 12px;
            border: 1px solid #222;
        }

        .metric-title {
            color: #888;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.2rem;
        }

        .metric-value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .val-red { color: #FF3B30; }
        .val-green { color: #34C759; }
        .val-neutral { color: #ffffff; }

        /* Buttons & Inputs */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            width: 100%;
            max-width: 450px;
            margin: 0 auto 2rem auto;
        }

        .btn {
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #333;
            border-radius: 14px;
            padding: 1.25rem 0;
            font-size: 1.2rem;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.1s, transform 0.1s;
        }

        .btn:active {
            background-color: #333;
            transform: scale(0.95);
        }

        .btn-minus {
            color: #ff8888;
            border-color: #442222;
        }

        .extras-container {
            max-width: 450px;
            width: 100%;
            margin: 0 auto 2rem auto;
            background: #151515;
            border-radius: 16px;
            border: 1px solid #222;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .extra-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .extra-label {
            font-size: 0.95rem;
            color: #ccc;
        }

        .extra-input {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 0.6rem 1rem;
            border-radius: 10px;
            width: 120px;
            text-align: right;
            font-size: 1rem;
        }
        
        .extra-input:focus { outline: none; border-color: #555; }

        .toggle-group { display: flex; gap: 0.5rem; }

        .toggle-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #888;
            padding: 0.6rem 1rem;
            border-radius: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            width: 60px;
            transition: all 0.2s;
        }

        .toggle-btn.active-yes { background: #233526; border-color: #34C759; color: #34C759; }
        .toggle-btn.active-no { background: #3a1c1c; border-color: #FF3B30; color: #FF3B30; }

        /* Stats */
        .stats-container {
            max-width: 450px;
            margin: 0 auto;
            width: 100%;
            border-top: 1px solid #222;
            padding-top: 2rem;
            padding-bottom: 2rem;
        }

        .average-box {
            background-color: #1a1a1a;
            padding: 1.25rem;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            border: 1px solid #222;
        }

        .avg-label, .stat-label {
            color: #888;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-label { font-size: 0.7rem; margin-bottom: 0.4rem; }

        .avg-val { font-size: 1.75rem; font-weight: 400; }
        .stat-val { font-size: 1.3rem; font-weight: 500; color: #fff; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background-color: #1a1a1a;
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid #222;
            display: flex;
            flex-direction: column;
        }

        .export-btn, .return-btn {
            width: 100%;
            background: transparent;
            border: 1px solid #333;
            color: #888;
            padding: 1rem;
            border-radius: 16px;
            font-size: 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.2s, color 0.2s;
        }

        .return-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 1.25rem;
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 2rem;
        }

        /* --- CALENDAR VIEW STYLES --- */
        #calendar-view {
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            flex-grow: 1;
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
        }

        .cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-top: 0.5rem;
        }

        .cal-month-title { font-size: 1.5rem; font-weight: 600; }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 2rem;
        }

        .cal-day-label {
            text-align: center;
            color: #888;
            font-size: 0.75rem;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .cal-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            border: 1px solid #222;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }

        .cal-green { background: rgba(52, 199, 89, 0.15); border-color: #34C759; color: #34C759; font-weight: bold; }
        .cal-red { background: rgba(255, 59, 48, 0.15); border-color: #FF3B30; color: #FF3B30; font-weight: bold; }
        .cal-selected { border: 2px solid #fff; }

        /* --- TIMER VIEW STYLES --- */
        #timer-view {
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            flex-grow: 1;
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
        }

        .timer-header {
            text-align: center;
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 2rem;
            padding-top: 0.5rem;
        }

        .timer-display-area {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 220px;
            height: 220px;
            margin: 0 auto 2.5rem auto;
        }

        .timer-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
            pointer-events: none;
        }

        .timer-ring-bg {
            fill: none;
            stroke: #222;
            stroke-width: 8;
        }

        .timer-ring-progress {
            fill: none;
            stroke: #444; /* Default idle color */
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 628.32; /* 2 * pi * 100 */
            stroke-dashoffset: 0;
            /* 1s linear transition ensures smooth ticking rather than snapping */
            transition: stroke-dashoffset 1s linear, stroke 0.3s ease;
        }

        .timer-ring-progress.ring-work { stroke: #34C759; } /* Green */
        .timer-ring-progress.ring-rest { stroke: #0A84FF; } /* Blue */

        .timer-circle-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .timer-status {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
            margin-bottom: 0.2rem;
        }
        
        .status-idle { color: #888; }
        .status-work { color: #34C759; }
        .status-rest { color: #0A84FF; }

        .timer-time {
            font-size: 4.5rem;
            font-weight: 300;
            letter-spacing: -2px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .timer-sets-count {
            font-size: 1.1rem;
            color: #aaa;
            margin-top: 0.75rem;
        }

        .slider-group {
            margin-bottom: 1.5rem;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            color: #ccc;
            font-size: 0.95rem;
        }

        .slider-val {
            font-weight: 600;
            color: #fff;
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        
        input[type=range]:focus { outline: none; }
        
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #333;
            border-radius: 4px;
        }
        
        input[type=range]::-webkit-slider-thumb {
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -9px;
            border: 2px solid #121212;
        }

        .timer-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .timer-btn {
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #333;
            border-radius: 14px;
            padding: 1.25rem 0;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.1s;
        }

        .timer-btn:active { background-color: #333; }
        .btn-start { background-color: #1a3320; border-color: #2e5c38; color: #4cd964; }
        .btn-start:active { background-color: #122416; }

    </style>
</head>
<body>

    <div id="main-view">
        <div class="logo-container">
            <img src="icon.png" alt="App Logo" class="app-logo">
        </div>

        <div class="top-bar">
            <button class="icon-btn" onclick="toggleTimer()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="13" r="8"></circle>
                    <polyline points="12 9 12 13 14 15"></polyline>
                    <line x1="12" y1="2" x2="12" y2="4"></line>
                    <line x1="10" y1="2" x2="14" y2="2"></line>
                </svg>
            </button>
            
            <div class="date-controls">
                <button class="date-btn" onclick="changeDate(-1)">&#8592;</button>
                <div class="date-display-wrapper">
                    <div class="date-display" id="date-label">Today</div>
                </div>
                <button class="date-btn" onclick="changeDate(1)">&#8594;</button>
            </div>

            <button class="icon-btn" onclick="toggleCalendar()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
            </button>
        </div>

        <div class="hero-container">
            <div class="display-container">
                <svg class="progress-ring" width="190" height="190">
                    <circle class="ring-bg" cx="95" cy="95" r="85"></circle>
                    <circle class="ring-progress" id="progress-circle" cx="95" cy="95" r="85"></circle>
                </svg>
                <div class="circle-content">
                    <div class="count" id="calorie-display">0</div>
                    <div class="target-btn" onclick="setTarget()">Goal: <span id="target-display">2500</span></div>
                </div>
            </div>

            <div class="side-metrics">
                <div class="metric-box">
                    <div class="metric-title">Gym</div>
                    <div class="metric-value" id="display-gym">--</div>
                </div>
                <div class="metric-box">
                    <div class="metric-title">Weight</div>
                    <div class="metric-value" id="display-weight">--</div>
                </div>
                <div class="metric-box">
                    <div class="metric-title">Steps</div>
                    <div class="metric-value" id="display-steps">--</div>
                </div>
            </div>
        </div>

        <div class="button-grid">
            <button class="btn" onclick="adjustCalories(100)">+100</button>
            <button class="btn" onclick="adjustCalories(200)">+200</button>
            <button class="btn" onclick="adjustCalories(300)">+300</button>
            <button class="btn" onclick="adjustCalories(500)">+500</button>
            <button class="btn" onclick="adjustCalories(1000)">+1000</button>
            <button class="btn btn-minus" onclick="adjustCalories(-100)">-100</button>
        </div>

        <div class="extras-container">
            <div class="extra-row">
                <span class="extra-label">Gym Session?</span>
                <div class="toggle-group">
                    <button class="toggle-btn" id="btn-gym-yes" onclick="setGym(true)">Yes</button>
                    <button class="toggle-btn" id="btn-gym-no" onclick="setGym(false)">No</button>
                </div>
            </div>
            <div class="extra-row">
                <span class="extra-label">Weight (kg)</span>
                <input type="number" step="0.1" class="extra-input" id="input-weight" oninput="setWeight(this.value)" placeholder="0.0">
            </div>
            <div class="extra-row">
                <span class="extra-label">Steps</span>
                <input type="number" class="extra-input" id="input-steps" oninput="setSteps(this.value)" placeholder="0">
            </div>
        </div>

        <div class="stats-container">
            <div class="average-box">
                <div class="avg-label">7-Day Calorie Avg</div>
                <div class="avg-val" id="avg-display">0</div>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">7-Day Steps Avg</div>
                    <div class="stat-val" id="stat-steps-avg">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">7-Day Steps Total</div>
                    <div class="stat-val" id="stat-steps-total">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">14-Day Weight Avg</div>
                    <div class="stat-val" id="stat-weight-avg">--</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">7-Day Gym Total</div>
                    <div class="stat-val" id="stat-gym-total">0</div>
                </div>
            </div>

            <button class="export-btn" onclick="exportCSV()">Export Data (CSV)</button>
        </div>
    </div>

    <div id="calendar-view" class="hidden">
        <div class="cal-header">
            <button class="icon-btn" onclick="changeCalMonth(-1)">&#8592;</button>
            <div class="cal-month-title" id="cal-month-year">Month</div>
            <button class="icon-btn" onclick="changeCalMonth(1)">&#8594;</button>
        </div>
        
        <div class="cal-grid" id="cal-grid"></div>
        <button class="return-btn" onclick="jumpToToday()">Return to Today</button>
    </div>

    <div id="timer-view" class="hidden">
        <div class="timer-header">Workout Timer</div>

        <div class="timer-display-area">
            <svg class="timer-ring" width="220" height="220">
                <circle class="timer-ring-bg" cx="110" cy="110" r="100"></circle>
                <circle class="timer-ring-progress" id="timer-progress-circle" cx="110" cy="110" r="100"></circle>
            </svg>
            <div class="timer-circle-content">
                <div class="timer-status status-idle" id="timer-status-text">IDLE</div>
                <div class="timer-time" id="timer-time-display">00:00</div>
                <div class="timer-sets-count" id="timer-set-counter">Set 0 of 0</div>
            </div>
        </div>

        <div class="slider-group">
            <div class="slider-header">
                <span>Sets</span>
                <span class="slider-val" id="val-sets">3</span>
            </div>
            <input type="range" id="slider-sets" min="1" max="10" step="1" value="3" oninput="updateTimerSettings()">
        </div>

        <div class="slider-group">
            <div class="slider-header">
                <span>Work Period</span>
                <span class="slider-val" id="val-work">01:00</span>
            </div>
            <input type="range" id="slider-work" min="30" max="600" step="30" value="60" oninput="updateTimerSettings()">
        </div>

        <div class="slider-group">
            <div class="slider-header">
                <span>Rest Period</span>
                <span class="slider-val" id="val-rest">00:30</span>
            </div>
            <input type="range" id="slider-rest" min="0" max="120" step="10" value="30" oninput="updateTimerSettings()">
        </div>

        <div class="timer-controls">
            <button class="timer-btn" onclick="resetTimer()">Reset</button>
            <button class="timer-btn btn-start" id="btn-timer-action" onclick="toggleTimerAction()">Start</button>
        </div>

        <button class="return-btn" onclick="jumpToToday()">Return to Today</button>
    </div>

    <script>
        // --- 1. DATA SETUP ---
        let rawHistory = JSON.parse(localStorage.getItem('calorieHistory')) || {};
        let history = {};
        for (let date in rawHistory) {
            if (typeof rawHistory[date] === 'number') {
                history[date] = { calories: rawHistory[date], weight: null, gym: false, steps: null };
            } else {
                history[date] = rawHistory[date];
            }
        }
        
        let dailyTarget = parseInt(localStorage.getItem('dailyTarget')) || 2500;
        const CIRCUMFERENCE = 534.07; 

        function getRealTodayStr() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        }

        let realToday = getRealTodayStr();
        let viewDateStr = realToday;
        let calViewDate = new Date();

        // UI Selectors
        const mainView = document.getElementById('main-view');
        const calView = document.getElementById('calendar-view');
        const timerView = document.getElementById('timer-view');
        
        const display = document.getElementById('calorie-display');
        const targetDisplay = document.getElementById('target-display');
        const dateLabel = document.getElementById('date-label');
        const avgDisplay = document.getElementById('avg-display');
        const progressCircle = document.getElementById('progress-circle');
        
        const dispGym = document.getElementById('display-gym');
        const dispWeight = document.getElementById('display-weight');
        const dispSteps = document.getElementById('display-steps');

        const btnGymYes = document.getElementById('btn-gym-yes');
        const btnGymNo = document.getElementById('btn-gym-no');
        const inWeight = document.getElementById('input-weight');
        const inSteps = document.getElementById('input-steps');

        const statStepsAvg = document.getElementById('stat-steps-avg');
        const statStepsTotal = document.getElementById('stat-steps-total');
        const statWeightAvg = document.getElementById('stat-weight-avg');
        const statGymTotal = document.getElementById('stat-gym-total');

        // --- 2. SWIPE GESTURES ---
        let touchstartX = 0;
        let touchendX = 0;

        mainView.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; }, {passive: true});
        mainView.addEventListener('touchend', e => { touchendX = e.changedTouches[0].screenX; handleSwipe(); }, {passive: true});

        function handleSwipe() {
            const swipeThreshold = 50; 
            if (touchendX < touchstartX - swipeThreshold) changeDate(1);
            if (touchendX > touchstartX + swipeThreshold) changeDate(-1);
        }

        // --- 3. UTILITY FUNCTIONS ---
        function addDaysStr(dateStr, days) {
            const [y, m, d] = dateStr.split('-');
            const date = new Date(y, m - 1, d);
            date.setDate(date.getDate() + days);
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        function formatDisplayDate(dateStr) {
            if (dateStr === realToday) return "Today";
            if (dateStr === addDaysStr(realToday, -1)) return "Yesterday";
            if (dateStr === addDaysStr(realToday, 1)) return "Tomorrow";
            const [y, m, d] = dateStr.split('-');
            const date = new Date(y, m - 1, d);
            return date.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
        }

        function formatTimeSec(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function ensureDayExists(dateStr) {
            if (typeof history[dateStr] === 'undefined') {
                history[dateStr] = { calories: 0, weight: null, gym: false, steps: null };
            }
        }

        function saveState() {
            localStorage.setItem('calorieHistory', JSON.stringify(history));
        }

        // --- 4. DATA INPUT HANDLERS ---
        function changeDate(direction) {
            viewDateStr = addDaysStr(viewDateStr, direction);
            updateUI();
        }

        function setTarget() {
            const input = prompt("Enter your daily calorie target:", dailyTarget);
            if (input !== null && !isNaN(input) && input > 0) {
                dailyTarget = parseInt(input);
                localStorage.setItem('dailyTarget', dailyTarget);
                updateUI();
            }
        }

        function adjustCalories(amount) {
            ensureDayExists(viewDateStr);
            history[viewDateStr].calories += amount;
            if (history[viewDateStr].calories < 0) history[viewDateStr].calories = 0;
            
            display.style.transform = 'scale(1.05)';
            setTimeout(() => display.style.transform = 'scale(1)', 100);
            updateUI();
        }

        function setGym(status) {
            ensureDayExists(viewDateStr);
            history[viewDateStr].gym = status;
            updateUI();
        }

        function setWeight(val) {
            ensureDayExists(viewDateStr);
            history[viewDateStr].weight = val ? parseFloat(val).toFixed(1) : null;
            saveState(); 
            updateTopMetrics(); 
            calculateRollingStats(); 
        }

        function setSteps(val) {
            ensureDayExists(viewDateStr);
            history[viewDateStr].steps = val ? parseInt(val) : null;
            saveState(); 
            updateTopMetrics(); 
            calculateRollingStats(); 
        }

        // --- NAVIGATION CONTROLS ---
        function toggleCalendar() {
            mainView.classList.add('hidden');
            timerView.classList.add('hidden');
            calView.classList.remove('hidden');
            const [y, m, d] = viewDateStr.split('-');
            calViewDate = new Date(y, m - 1, 1);
            renderCalendar();
        }

        function toggleTimer() {
            mainView.classList.add('hidden');
            calView.classList.add('hidden');
            timerView.classList.remove('hidden');
            updateTimerSettings(); 
        }

        function jumpToToday() {
            viewDateStr = realToday;
            calView.classList.add('hidden');
            timerView.classList.add('hidden');
            mainView.classList.remove('hidden');
            updateUI();
        }

        // --- 5. TIMER ENGINE ---
        let timerInterval;
        let isTimerRunning = false;
        let timerPhase = 'idle'; // 'idle', 'work', 'rest', 'done'
        let currentSet = 1;
        let timeRemaining = 0;
        let totalPhaseTime = 0; // Needed to calculate the ring circle drain percentage

        const sliderSets = document.getElementById('slider-sets');
        const sliderWork = document.getElementById('slider-work');
        const sliderRest = document.getElementById('slider-rest');
        const valSets = document.getElementById('val-sets');
        const valWork = document.getElementById('val-work');
        const valRest = document.getElementById('val-rest');
        
        const timerStatusText = document.getElementById('timer-status-text');
        const timerTimeDisplay = document.getElementById('timer-time-display');
        const timerSetCounter = document.getElementById('timer-set-counter');
        const timerProgressCircle = document.getElementById('timer-progress-circle');
        const btnTimerAction = document.getElementById('btn-timer-action');

        const TIMER_CIRCUMFERENCE = 628.32; // 2 * pi * 100

        function updateTimerSettings() {
            valSets.textContent = sliderSets.value;
            valWork.textContent = formatTimeSec(sliderWork.value);
            valRest.textContent = formatTimeSec(sliderRest.value);
            
            if (!isTimerRunning && timerPhase === 'idle') {
                timerTimeDisplay.textContent = formatTimeSec(sliderWork.value);
                timerSetCounter.textContent = `Set 1 of ${sliderSets.value}`;
                timerProgressCircle.style.strokeDashoffset = 0; // Full ring
            }
        }

        function toggleTimerAction() {
            if (timerPhase === 'done') resetTimer();

            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                btnTimerAction.textContent = "Resume";
            } else {
                if (timerPhase === 'idle') {
                    timerPhase = 'work';
                    timeRemaining = parseInt(sliderWork.value);
                    totalPhaseTime = timeRemaining;
                    currentSet = 1;
                }
                isTimerRunning = true;
                btnTimerAction.textContent = "Pause";
                updateTimerVisuals();
                timerInterval = setInterval(timerTick, 1000);
            }
        }

        function timerTick() {
            timeRemaining--;

            if (timeRemaining < 0) {
                if (timerPhase === 'work') {
                    if (currentSet >= parseInt(sliderSets.value)) {
                        // Finished entirely
                        timerPhase = 'done';
                        isTimerRunning = false;
                        clearInterval(timerInterval);
                        btnTimerAction.textContent = "Start";
                        timerStatusText.textContent = "COMPLETE!";
                        timerStatusText.className = "timer-status status-work";
                        timerTimeDisplay.textContent = "00:00";
                        timerProgressCircle.style.strokeDashoffset = 0;
                        timerProgressCircle.classList.remove('ring-rest');
                        timerProgressCircle.classList.add('ring-work');
                        return;
                    } else if (parseInt(sliderRest.value) > 0) {
                        // Move to Rest phase
                        timerPhase = 'rest';
                        timeRemaining = parseInt(sliderRest.value);
                        totalPhaseTime = timeRemaining;
                    } else {
                        // Skip rest if it was set to 0s
                        currentSet++;
                        timeRemaining = parseInt(sliderWork.value);
                        totalPhaseTime = timeRemaining;
                    }
                } else if (timerPhase === 'rest') {
                    // Move to Work phase
                    timerPhase = 'work';
                    currentSet++;
                    timeRemaining = parseInt(sliderWork.value);
                    totalPhaseTime = timeRemaining;
                }
            }
            updateTimerVisuals();
        }

        function updateTimerVisuals() {
            timerTimeDisplay.textContent = formatTimeSec(timeRemaining);
            timerSetCounter.textContent = `Set ${currentSet} of ${sliderSets.value}`;

            // Calculate how much the ring has drained
            let percentage = totalPhaseTime > 0 ? (timeRemaining / totalPhaseTime) : 0;
            let offset = TIMER_CIRCUMFERENCE - (percentage * TIMER_CIRCUMFERENCE);
            timerProgressCircle.style.strokeDashoffset = offset;

            // Handle Ring & Text Colors
            timerProgressCircle.classList.remove('ring-work', 'ring-rest');
            
            if (timerPhase === 'work') {
                timerStatusText.textContent = "WORK";
                timerStatusText.className = "timer-status status-work";
                timerProgressCircle.classList.add('ring-work');
            } else if (timerPhase === 'rest') {
                timerStatusText.textContent = "REST";
                timerStatusText.className = "timer-status status-rest";
                timerProgressCircle.classList.add('ring-rest');
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            timerPhase = 'idle';
            currentSet = 1;
            btnTimerAction.textContent = "Start";
            timerStatusText.textContent = "IDLE";
            timerStatusText.className = "timer-status status-idle";
            
            // Reset Ring
            timerProgressCircle.classList.remove('ring-work', 'ring-rest');
            timerProgressCircle.style.strokeDashoffset = 0;
            
            updateTimerSettings();
        }

        // --- 6. CALENDAR LOGIC ---
        function changeCalMonth(direction) {
            calViewDate.setMonth(calViewDate.getMonth() + direction);
            renderCalendar();
        }

        function renderCalendar() {
            const year = calViewDate.getFullYear();
            const month = calViewDate.getMonth();
            
            document.getElementById('cal-month-year').textContent = calViewDate.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

            const firstDay = new Date(year, month, 1).getDay(); 
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const grid = document.getElementById('cal-grid');
            grid.innerHTML = '';

            ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(day => {
                const el = document.createElement('div');
                el.className = 'cal-day-label';
                el.textContent = day;
                grid.appendChild(el);
            });

            for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));

            for (let i = 1; i <= daysInMonth; i++) {
                const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const el = document.createElement('div');
                el.className = 'cal-day';
                el.textContent = i;

                if (history[dStr] && history[dStr].calories > 0) {
                    if (history[dStr].calories > dailyTarget) el.classList.add('cal-red');
                    else el.classList.add('cal-green');
                }

                if (dStr === viewDateStr) el.classList.add('cal-selected');

                el.onclick = () => {
                    viewDateStr = dStr;
                    jumpToToday();
                };

                grid.appendChild(el);
            }
        }

        // --- 7. MAIN UI STATS & RENDER ---
        function calculateRollingStats() {
            let calSum = 0, calCount = 0;
            let stepSum = 0, stepCount = 0, stepTotal = 0;
            let gymTotal = 0;
            let weightSum = 0, weightCount = 0;

            for (let i = 0; i < 14; i++) {
                let checkDate = addDaysStr(viewDateStr, -i);
                let dayData = history[checkDate];

                if (dayData) {
                    if (dayData.weight) {
                        weightSum += parseFloat(dayData.weight);
                        weightCount++;
                    }

                    if (i < 7) {
                        if (dayData.calories > 0 || checkDate === realToday) {
                            calSum += dayData.calories;
                            calCount++;
                        }
                        if (dayData.steps > 0) {
                            stepSum += parseInt(dayData.steps);
                            stepCount++;
                            stepTotal += parseInt(dayData.steps);
                        }
                        if (dayData.gym === true) gymTotal++;
                    }
                }
            }

            avgDisplay.textContent = calCount === 0 ? 0 : Math.round(calSum / calCount).toLocaleString();
            statStepsAvg.textContent = stepCount === 0 ? 0 : Math.round(stepSum / stepCount).toLocaleString();
            statStepsTotal.textContent = stepTotal.toLocaleString();
            statWeightAvg.textContent = weightCount === 0 ? "--" : (weightSum / weightCount).toFixed(1) + " kg";
            statGymTotal.textContent = gymTotal;
        }

        function updateTopMetrics() {
            ensureDayExists(viewDateStr);
            const dayData = history[viewDateStr];

            dispGym.innerHTML = dayData.gym ? `<span class="val-green">Yes</span>` : `<span class="val-red">No</span>`;
            dispWeight.innerHTML = dayData.weight ? `<span class="val-neutral">${dayData.weight} kg</span>` : `<span class="val-neutral">--</span>`;
            dispSteps.innerHTML = dayData.steps ? `<span class="val-neutral">${parseInt(dayData.steps).toLocaleString()}</span>` : `<span class="val-neutral">--</span>`;
        }

        function updateUI() {
            ensureDayExists(viewDateStr);
            const dayData = history[viewDateStr];
            const currentCals = dayData.calories;

            dateLabel.textContent = formatDisplayDate(viewDateStr);
            display.textContent = currentCals;
            targetDisplay.textContent = dailyTarget;

            inWeight.value = dayData.weight || '';
            inSteps.value = dayData.steps || '';
            
            if (dayData.gym === true) {
                btnGymYes.classList.add('active-yes');
                btnGymNo.classList.remove('active-no');
            } else {
                btnGymYes.classList.remove('active-yes');
                btnGymNo.classList.add('active-no');
            }

            updateTopMetrics();
            saveState();

            const percentage = Math.min(currentCals / dailyTarget, 1);
            const offset = CIRCUMFERENCE - (percentage * CIRCUMFERENCE);
            progressCircle.style.strokeDashoffset = offset;

            if (currentCals > dailyTarget) progressCircle.classList.add('over-target');
            else progressCircle.classList.remove('over-target');

            calculateRollingStats();
        }

        function exportCSV() {
            if (Object.keys(history).length === 0) {
                alert("No data to export yet!");
                return;
            }

            let csvContent = "Date,Calories,Weight (kg),Gym Session,Steps\n";
            const sortedDates = Object.keys(history).sort();
            
            sortedDates.forEach(date => {
                let d = history[date];
                csvContent += `${date},${d.calories || 0},${d.weight || ""},${d.gym ? "Yes" : "No"},${d.steps || ""}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.setAttribute("href", URL.createObjectURL(blob));
            link.setAttribute("download", `fitness_history_${getRealTodayStr()}.csv`);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.addEventListener("visibilitychange", function() {
            if (document.visibilityState === 'visible') {
                const checkToday = getRealTodayStr();
                if (checkToday !== realToday) {
                    realToday = checkToday;
                    viewDateStr = realToday; 
                    updateUI();
                }
            }
        });

        updateUI();
        updateTimerSettings();
    </script>
</body>
</html>
